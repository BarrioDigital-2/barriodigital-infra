# ========== INFRAESTRUCTURA LOCAL - BARRIODIGITAL ==========
# Todo lo que necesitan los microservicios para correr en tu PC:
#   - Cluster RabbitMQ de 2 nodos  (5672 / 5673, panel http://localhost:15672)
#   - Kafka + Zookeeper            (localhost:9092 desde el PC, kafka:9093 dentro de Docker)
#   - MySQL 8.4                    (localhost:3307, usuario root / root)
#
# Levantar (desde esta carpeta):  docker compose up -d
# Ver estado:                     docker compose ps
# Detener sin borrar datos:       docker compose stop

# Se mantiene el nombre de proyecto anterior para reutilizar los volúmenes (datos) que ya existían
name: barriodigital-rabbitmq

services:
  # ========== RABBITMQ: NODO 1 (SEMILLA) ==========
  rabbit1:
    image: rabbitmq:4.2-management
    container_name: rabbit1
    # El hostname define el nombre del nodo (rabbit@rabbit1)
    hostname: rabbit1
    entrypoint: ["bash", "/opt/cluster/cluster-entrypoint.sh"]
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Panel de administración
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-barriodigital}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-barrio2026Rabbit}
      # Misma cookie en ambos nodos: requisito para formar el cluster
      ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-barriodigital-cluster-cookie}
    volumes:
      - rabbit1_data:/var/lib/rabbitmq
      - ../docker/rabbitmq/cluster-entrypoint.sh:/opt/cluster/cluster-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - barriodigital-net

  # ========== RABBITMQ: NODO 2 (SE UNE AL CLUSTER DE rabbit1) ==========
  rabbit2:
    image: rabbitmq:4.2-management
    container_name: rabbit2
    hostname: rabbit2
    entrypoint: ["bash", "/opt/cluster/cluster-entrypoint.sh"]
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-barriodigital}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-barrio2026Rabbit}
      ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-barriodigital-cluster-cookie}
      # Nodo al que se une al arrancar (ver cluster-entrypoint.sh)
      JOIN_CLUSTER_HOST: rabbit1
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
      - ../docker/rabbitmq/cluster-entrypoint.sh:/opt/cluster/cluster-entrypoint.sh:ro
    # Arranca junto con rabbit1 (no espera a que esté sano): en RabbitMQ 4.x un nodo de un cluster
    # ya formado necesita a la mayoría (con 2 nodos, ambos) para terminar de arrancar
    depends_on:
      rabbit1:
        condition: service_started
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - barriodigital-net

  # ========== KAFKA ==========
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - barriodigital-net

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    # Si cae al arrancar (ej. NodeExistsException tras un apagado brusco), Docker lo reintenta
    restart: on-failure
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # INTERNAL: entre contenedores (kafka:9093) · EXTERNAL: desde tu PC (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Los topics se crean explícitamente (KafkaTopicConfig o ms-barriodigital-kafka-admin)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - barriodigital-net

  # ========== MYSQL ==========
  mysql:
    image: mysql:8.4
    container_name: barriodigital-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-barriodigital}
    ports:
      # 3307 en el PC porque el 3306 suele estar ocupado por un MySQL instalado en Windows
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - barriodigital-net

volumes:
  rabbit1_data:
  rabbit2_data:
  zookeeper_data:
  kafka_data:
  mysql_data:

networks:
  barriodigital-net:
    name: barriodigital-net
